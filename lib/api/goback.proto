syntax = "proto3";
option go_package = "./api";
package api;

service GoBack {
    rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {};
    rpc GetAccount(AccountRequest) returns (AccountResponse) {};
    rpc GetQuote(QuoteRequest) returns (QuoteResponse) {};
    rpc BuyShares(TxRequest) returns (TxResponse) {};
    rpc SellShares(TxRequest) returns (TxResponse) {};
    rpc AutomatedBuy(TxRequest) returns (TxResponse) {};
    rpc AutomatedSell(TxRequest) returns (TxResponse) {};
    rpc GetTransactionLogs(TransactionLogRequest) returns (TransactionLogResponse) {};
    rpc CancelTransaction(CancelTxRequest) returns (CancelTxResponse) {};
    rpc CommitTransaction(CommitTxRequest) returns (CommitTxResponse) {};
}

message CreateAccountRequest {
    string UserId = 1;
    string Username = 2;
    string Email = 3;
    string Password = 4;
    float  Balance = 5;
}
message CreateAccountResponse {
    string UserId = 1;
}
message AccountRequest {
    string UserId = 1;
}
message AccountResponse {
    string UserId = 1;
    string Username = 2;
    string Email = 3;
    string Password = 4;
    float  Balance = 5;
}
message QuoteRequest {
    string Stock = 1;
}
message QuoteResponse {
    string Stock = 1;
    string Price = 2;
}
message TxRequest {
    string Type = 1;
    string UserId = 2;
    string Stock = 3;
    float  Shares = 4;
}
message TxResponse {
    bool Status = 1;
    string Type = 2;
    string Timestamp = 3;
    string Stock = 4;
    float Shares = 5;
}
message TransactionLogRequest {
    string UserId = 1;
}
message TransactionLogResponse {
    string UserId = 1;
    repeated Transaction Transactions = 2;
}
message CancelTxRequest {}
message CancelTxResponse {}
message CommitTxRequest {}
message CommitTxResponse {}
message Transaction {
    string TxId = 1;
    string UserId = 2;
    string Timestamp = 3;
    string Stock = 4;
    float  Shares = 5;
}
