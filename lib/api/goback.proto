syntax = "proto3";
option go_package = "./api";
package api;

import "buf/validate/validate.proto";


service GoBack {
    rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {};
    rpc GetAccount(AccountRequest) returns (AccountResponse) {};
    rpc AddBalance(BalanceRequest) returns (BalanceResponse) {};
    rpc GetPortfolio(PortfolioRequest) returns (PortfolioResponse) {};
    rpc GetQuote(QuoteRequest) returns (QuoteResponse) {};
    rpc GetTransactionLogs(TransactionLogRequest) returns (TransactionLogResponse) {};
    rpc CancelTransaction(CancelTxRequest) returns (CancelTxResponse) {};
    rpc CommitTransaction(CommitTxRequest) returns (CommitTxResponse) {};
}

message CreateAccountRequest {
    string username = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 128,
        (buf.validate.field).string.min_len = 3
    ];
    string email = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.email = true,
        (buf.validate.field).string.max_len = 254,
        (buf.validate.field).string.min_len = 3
    ];
    string password = 3 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 128,
        (buf.validate.field).string.min_len = 8
    ];
    double balance = 4 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message CreateAccountResponse {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
}
message AccountRequest {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
}
message AccountResponse {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    string username = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 128,
        (buf.validate.field).string.min_len = 3
    ];
    string email = 3 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.email = true,
        (buf.validate.field).string.max_len = 254,
        (buf.validate.field).string.min_len = 3
    ];
    string password = 4 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 128,
        (buf.validate.field).string.min_len = 8
    ];
    double balance = 5 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message BalanceRequest {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    double add_amount = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message BalanceResponse {
    bool   status = 1 [(buf.validate.field).required = true];
    double new_balance = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message PortfolioRequest {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
}
message PortfolioLog {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    string stock = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 5,
        (buf.validate.field).string.min_len = 3
    ];
    double shares = 3 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message PortfolioResponse {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    repeated PortfolioLog portfolio_logs = 2;
}
message QuoteRequest {
    string stock = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 5,
        (buf.validate.field).string.min_len = 3
    ];
}
message QuoteResponse {
    string stock = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 5,
        (buf.validate.field).string.min_len = 3
    ];
    string price = 2;
}
message TxRequest {
    string type = 1;
    string user_id = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    string stock = 3 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 5,
        (buf.validate.field).string.min_len = 3
    ];
    double shares = 4 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
    double share_price = 5 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message TxResponse {
    bool   status = 1;
    string type = 2;
    string timestamp = 3;
    string stock = 4 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 5,
        (buf.validate.field).string.min_len = 3
    ];
    double shares = 5 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
    double total_cost = 6 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
message TransactionLogRequest {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
}
message TransactionLogResponse {
    string user_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    repeated TransactionLog transaction_logs = 2;
}
message CancelTxRequest {}
message CancelTxResponse {}
message CommitTxRequest {}
message CommitTxResponse {}
message TransactionLog {
    string tx_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    string user_id = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
    string type = 3;
    string timestamp = 4;
    string stock = 5 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.max_len = 5,
        (buf.validate.field).string.min_len = 3
    ];
    double shares = 6 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
    double share_price = 7 [
        (buf.validate.field).required = true,
        (buf.validate.field).double.gte = 0.0
    ];
}
