syntax = "proto3";
option go_package = "./api";
package api;

service GoBack {
    rpc GetAccount(AccountRequest) returns (AccountResponse) {};
    rpc GetQuote(QuoteRequest) returns (QuoteResponse) {};
    rpc BuyShares(BuyRequest) returns (BuyResponse) {};
    rpc SellShares(SellRequest) returns (SellResponse) {};
    rpc AutomatedBuy(AutoBuyRequest) returns (AutoBuyResponse) {};
    rpc AutomatedSell(AutoSellRequest) returns (AutoSellResponse) {};
    rpc GetTransactions(TransactionRequest) returns (TransactionResponse) {};
    rpc CancelTransaction(CancelTxRequest) returns (CancelTxResponse) {};
    rpc CommitTransaction(CommitTxRequest) returns (CommitTxResponse) {};
}

message AccountRequest {
    string UserId = 1;
}
message AccountResponse {}
message QuoteRequest {
    string Stock = 1;
}
message QuoteResponse {
    string Stock = 1;
    string Price = 2;
}
message BuyRequest {}
message BuyResponse {}
message SellRequest {}
message SellResponse {}
message AutoBuyRequest {}
message AutoBuyResponse {}
message AutoSellRequest {}
message AutoSellResponse {}
message TransactionRequest {
    string UserId = 1;
}
message TransactionResponse {
    repeated Transaction Transactions = 1;
}
message CancelTxRequest {}
message CancelTxResponse {}
message CommitTxRequest {}
message CommitTxResponse {}
message Transaction {
    string TxId = 1;
    string UserId = 2;
    string Timestamp = 3;
    string Stock = 4;
    float  Shares = 5;
}
